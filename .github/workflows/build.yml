name: Build

# Produces a downloadable homehold-<version>.xpi on every push, and attaches it
# to a GitHub Release when a v* tag is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build .xpi
        run: npm run build

      - name: Upload the .xpi
        uses: actions/upload-artifact@v4
        with:
          name: homehold-xpi
          path: dist/*.xpi
          if-no-files-found: error

      # A v* tag turns the artifact into a Release asset, which is the file to
      # hand to someone who just wants to install the extension.
      #
      # The versioned copy is the archive; the unversioned one exists so the
      # link .../releases/latest/download/homehold.xpi keeps working after the
      # version number moves on.
      - name: Give the asset a stable name
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp dist/homehold-*.xpi dist/homehold.xpi

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/homehold-*.xpi
            dist/homehold.xpi
          generate_release_notes: true
