name: Build

# Builds the package on every push, and publishes a downloadable release when a
# v* tag is pushed.
#
# Tagged releases are signed with Mozilla when the AMO_JWT_ISSUER and
# AMO_JWT_SECRET secrets are configured (create them at
# https://addons.mozilla.org/developers/addon/api/key/). Without them the
# release still happens, just unsigned.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build .xpi
        run: npm run build

      - name: Upload the .xpi
        uses: actions/upload-artifact@v4
        with:
          name: homehold-xpi
          path: dist/*.xpi
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sign with Mozilla
        if: env.AMO_JWT_ISSUER != ''
        run: npm run sign -- --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET"

      # web-ext sign names its output after the add-on, so rather than guess the
      # filename, look for the package that actually carries a signature.
      #
      # The unversioned copy exists so that
      # .../releases/latest/download/homehold.xpi keeps resolving after the
      # version number moves on.
      - name: Collect the release asset
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          mkdir -p release

          pkg=""
          for f in dist/*.xpi; do
            [ -e "$f" ] || continue
            if unzip -l "$f" | grep -q "META-INF/"; then
              pkg="$f"
              break
            fi
          done

          if [ -z "$pkg" ]; then
            echo "No signed package found - publishing an unsigned build."
            npm run build
            pkg="dist/homehold-${VERSION}.xpi"
          else
            echo "Signing produced $(basename "$pkg")."
          fi

          cp "$pkg" "release/homehold-${VERSION}.xpi"
          cp "$pkg" "release/homehold.xpi"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.xpi
          generate_release_notes: true
