<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HomeHold</title>
    <link rel="stylesheet" href="newtab.css" />
    <!-- defaults.js supplies the URL rule and the theme default; theme.js needs
         both before the body paints. -->
    <script src="defaults.js"></script>
    <script src="theme.js"></script>
  </head>
  <body>
    <main class="notice" id="notice" hidden>
      <h1 class="notice__title" id="noticeTitle" data-i18n="noticeTitle">HomeHold</h1>
      <p class="notice__text" id="noticeText"></p>
      <button class="notice__button" id="openSettings" type="button" data-i18n="openSettings"></button>
    </main>

    <!-- localizeDocument() fills the data-i18n attributes, so i18n.js goes first. -->
    <script src="i18n.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
